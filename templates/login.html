{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3 text-center">Student Portal Login</h3>
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password..." required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Sign In</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Don't have an account? <a href="/register">Sign Up</a></small>
                </div>
            </div>
        </div>

        {% if executed_query %}
        <div class="card mt-3 border-secondary">
            <div class="card-header bg-dark text-white fw-bold">Executed Query Panel</div>
            <div class="card-body">
                <pre class="bg-dark text-info p-2 rounded mb-0"><code>{{ executed_query }}</code></pre>
            </div>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
