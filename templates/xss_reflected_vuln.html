{% extends "base.html" %}
{% block title %}Course Directory - Search{% endblock %}

{% block content %}
<div class="card">
    <h2>Course Search Directory</h2>
    <p>Reflected XSS Vulnerability Testing Page</p>
    
    <form method="GET">
        <input type="text" name="q" value="{{ q }}" placeholder="Search course title or code...">
        <button type="submit" class="btn">Search Directory</button>
    </form>
</div>

{% if q %}
<div class="card">
    <h3>Search Results</h3>
    <p>Results for: <b>{{ q | safe }}</b></p>
</div>
{% endif %}
{% endblock %}
