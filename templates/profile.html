{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm border-0">
            <h3 class="fw-bold mb-3">Student Profile Settings</h3>
            <p><strong>Name:</strong> {{ session['full_name'] }}</p>
            <p><strong>Username:</strong> {{ session['username'] }}</p>

            <form method="POST" action="/profile" class="mt-3">
                {% if session['mode'] == 'safe' %}
                    <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                {% endif %}
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" value="{{ session['email'] }}" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
