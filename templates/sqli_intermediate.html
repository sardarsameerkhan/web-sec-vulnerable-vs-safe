{% extends "base.html" %}
{% block title %}Student Directory Lookup{% endblock %}

{% block content %}
<div class="card">
    <h2>Student Directory Lookup</h2>
    <p style="color:var(--text-muted);">SQL Injection Level 2 (Error & Boolean Leakage)</p>
    
    <form method="GET">
        <label>Search by Database Record ID:</label>
        <input type="text" name="id" value="{{ user_id }}" placeholder="e.g. 1">
        <button type="submit" class="btn">Query Record</button>
    </form>
</div>

<div class="card">
    <h3>Directory Output</h3>
    <pre style="background:#f8fafc; padding:1rem; border:1px solid var(--border); border-radius:4px;">{{ result }}</pre>
</div>
{% endblock %}
