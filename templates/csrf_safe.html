{% extends "base.html" %}
{% block title %}Account Settings - Safe{% endblock %}

{% block content %}
<div class="card" style="max-width:550px;">
    <h2>Account Settings - Update Email</h2>
    <p style="color:var(--text-muted);">Currently Logged in User: <b>{{ user }}</b></p>
    
    {% if msg %}
        <p style="color:var(--success); font-weight:600;">{{ msg }}</p>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Institutional Email Address:</label>
        <input type="email" name="email" placeholder="e.g. sardar.sameer@flex.edu" required>
        <button type="submit" class="btn">Update Account Profile</button>
    </form>
</div>
{% endblock %}
