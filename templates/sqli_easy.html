{% extends "base.html" %}
{% block title %}Student Portal Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>🎓 EduPortal Account Login</h2>
    <p>Test Level 1 SQL Injection (Authentication Bypass)</p>
    
    {% if msg %}
        <p style="padding: 0.75rem; background: #fee2e2; color: #991b1b; border-radius: 6px; font-weight: 600;">{{ msg }}</p>
    {% endif %}

    <form method="POST">
        <label>Student ID / Username:</label>
        <input type="text" name="username" placeholder="e.g. john_doe" required>
        
        <label>Password:</label>
        <input type="password" name="password" placeholder="••••••••">
        
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
    </form>
</div>
{% endblock %}
