{% extends "base.html" %}
{% block title %}FLEX Portal Authentication{% endblock %}

{% block content %}
<div class="card" style="max-width:480px; margin: 0 auto;">
    <h2>Portal Authentication</h2>
    <p style="color:var(--text-muted);">SQL Injection Level 1 (Authentication Bypass)</p>
    
    {% if msg %}
        <p style="padding:0.75rem; background:#fee2e2; color:#991b1b; border-radius:4px; font-weight:600;">{{ msg }}</p>
    {% endif %}

    <form method="POST">
        <label>Username / User ID:</label>
        <input type="text" name="username" placeholder="e.g. sardar_sameer" required>
        
        <label>Password:</label>
        <input type="password" name="password" placeholder="••••••••">
        
        <button type="submit" class="btn" style="width:100%;">Sign In</button>
    </form>
</div>
{% endblock %}
