{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4 mb-4">
            <h2 class="fw-bold">Welcome, {{ session['full_name'] }}</h2>
            <p class="text-muted">FLEX Academic Student Dashboard</p>
            <hr>
            <div class="row text-center mt-3">
                <div class="col-md-4">
                    <div class="p-3 bg-light rounded">
                        <h4 class="fw-bold text-primary">2</h4>
                        <small>Enrolled Courses</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-3 bg-light rounded">
                        <h4 class="fw-bold text-success">3.8</h4>
                        <small>Current CGPA</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-3 bg-light rounded">
                        <h4 class="fw-bold text-warning">Active</h4>
                        <small>Academic Status</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-4">
        <div class="card shadow-sm border-0 p-3">
            <h5 class="fw-bold mb-3">Campus Notices</h5>
            <div class="alert alert-info py-2">Midterm Exam schedule released.</div>
            <div class="alert alert-secondary py-2">Library extended hours start Monday.</div>
        </div>
    </div>
</div>
{% endblock %}
