{% extends "base.html" %}
{% block title %}Announcements - Safe DOM{% endblock %}

{% block content %}
<div class="card">
    <h2>Academic Announcements Noticeboard</h2>
    <p style="color:var(--text-muted);">Safe DOM-Based XSS Module (Text Content Safe Assignment)</p>
    <div id="output" style="padding:1rem; background:#f8fafc; border:1px solid var(--border); border-radius:4px; margin-top:1rem;"></div>
</div>

<script>
    var hash = decodeURIComponent(window.location.hash.substring(1));
    if (hash) {
        document.getElementById("output").textContent = "Notice Banner: " + hash;
    } else {
        document.getElementById("output").textContent = "Notice Banner: No active notice hash provided in URL.";
    }
</script>
{% endblock %}
