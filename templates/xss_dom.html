{% extends "base.html" %}
{% block content %}
<div class="card p-4 shadow-sm mb-4">
    <h3 class="fw-bold">Announcements Noticeboard</h3>
    <p class="text-muted">DOM-Based XSS Demonstration (Client-Side Sink)</p>
    <div class="alert alert-secondary fs-5" id="notice-output">Notice Banner: </div>
</div>

<div class="card border-secondary shadow-sm">
    <div class="card-header bg-dark text-white fw-bold">DOM Execution Sink Monitor</div>
    <div class="card-body">
        <p><strong>JavaScript Property Assigned:</strong> 
            <span id="sink-badge" class="badge bg-secondary">Detecting...</span>
        </p>
        <p class="mb-1"><strong>URL Hash Source (location.hash):</strong></p>
        <pre class="bg-dark text-light p-3 rounded"><code id="hash-source"></code></pre>
    </div>
</div>

<script>
    const hashVal = decodeURIComponent(window.location.hash.substring(1));
    document.getElementById("hash-source").textContent = hashVal || "(Add #payload to URL in address bar)";
    
    const outputElem = document.getElementById("notice-output");
    const badge = document.getElementById("sink-badge");
    const isVulnerable = window.location.pathname.includes("vulnerable");

    if (isVulnerable) {
        badge.className = "badge bg-danger";
        badge.textContent = "innerHTML (Unsafe Sink)";
        outputElem.innerHTML = "<b>Notice Banner:</b> " + hashVal;
    } else {
        badge.className = "badge bg-success";
        badge.textContent = "textContent (Safe Property Assignment)";
        outputElem.textContent = "Notice Banner: " + hashVal;
    }
</script>
{% endblock %}
